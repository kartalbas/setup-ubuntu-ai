# =============================================================================
# config.qwen3.6-27b-turbo.conf — "the real recipe": Qwen3.6-27B at 100k context
# on a single 16 GB GPU (RTX 5080 / A5000), via the buun-llama-cpp TurboQuant
# KV cache. Reproduces the r/LocalLLaMA build by Due-Project-7507.
#
# Why this needs a fork + a specific quant:
#   * 100k context only fits in 16 GB because the V cache uses TurboQuant
#     (`turbo3_tcq`), which exists ONLY in spiritbuun/buun-llama-cpp, not in
#     upstream llama.cpp. The build step clones it automatically (LLAMACPP_REPO).
#   * The body is the Ununnilium IQ4_XS *pure* quant (Unsloth imatrix), the
#     exact file the recipe uses — best measured PPL at 110k of the IQ4 variants.
#
# To use it on a fresh machine (same 16 GB NVIDIA GPU, any username):
#   1. sudo cp config.qwen3.6-27b-turbo.conf /etc/setup-ubuntu-ai/config.conf
#   2. Set your own API key below (or drop "--api-key …" to serve without auth).
#   3. sudo ./setup.sh restore
#
# `restore` re-detects the GPU, re-homes the paths to the new user, builds the
# fork, downloads MODEL_REPO/MODEL_FILE from Hugging Face, and installs the
# auto-starting service — nothing is prepared by hand.
#
# REQUIREMENTS / GOTCHAS (enforced or warned about by the script):
#   * CUDA 13.1 or 13.3 ONLY. CUDA 13.0/13.2 make turbo3_tcq output gibberish;
#     the build step (40-build-llamacpp) aborts on those versions.
#   * 16 GB GPU, model fully on GPU. ~13.3 GB weights + TurboQuant KV @ 100k fit
#     with ~1–2 GB headroom. Lower LLAMA_CTX if it OOMs on first load.
#   * One model at a time: this becomes THE served model on port 8080.
# =============================================================================

# --- llama.cpp engine: the TurboQuant fork, in its OWN dir so an existing
#     upstream build (e.g. a fast small model) is left untouched. ---
LLAMACPP_REPO="https://github.com/spiritbuun/buun-llama-cpp"
# Optional: pin a branch/tag/commit for reproducibility (empty = default branch).
# LLAMACPP_REF=""
# Own dir (re-homed to the target user by `restore`) so an existing upstream
# build is left untouched. NOTE: this config has no inline comments after a
# value — the parser would fold them into the value.
LLAMACPP_DIR="/home/server/buun-llama-cpp"
LLAMACPP_BACKEND="cuda"

# --- Chat template / runtime behaviour ---
# The Ununnilium GGUF already ships an agentic-friendly chat template, so we use
# the model's embedded template as-is (no raise_exception fixup needed for Qwen).
CHAT_TEMPLATE_FIXUP="0"
LLAMA_CTX="100000"
LLAMA_NGL="999"
LLAMA_HOST="0.0.0.0"
LLAMA_PORT="8080"
# The TurboQuant recipe — the OP's *measured-working* command on a 16 GB card:
# BOTH K and V caches on turbo3_tcq, and --parallel 1. This is what makes 100k
# fit. (The "k=q8_0" quality tweak from the thread is heavier and OOMs at 100k on
# 16 GB — q8_0 K is far larger than a TCQ K cache; only use it at lower context.)
# Leaving --parallel at its auto default (4) inflates the compute/KV buffers and
# also OOMs. --no-mmap pins weights in VRAM; --fit off silences the auto-offload
# warning since all knobs are explicit. Samplers are Qwen's recommended values.
# Replace the API key or drop "--api-key …" (only safe on a trusted LAN — 0.0.0.0).
LLAMA_EXTRA_ARGS="--flash-attn on --parallel 1 --cache-type-k turbo3_tcq --cache-type-v turbo3_tcq --no-mmap --fit off --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0.0 --api-key REPLACE_WITH_YOUR_API_KEY"

# --- Model coordinates (downloaded straight from Hugging Face by `restore`) ---
MODEL_REPO="Ununnilium/Qwen3.6-27B-IQ4_XS-pure-GGUF"
MODEL_FILE="qwen3.6-27b-IQ4_XS-pure.gguf"

# --- eGPU transport (harmless on an internal GPU; auto-authorizes a TB dock) ---
TB_AUTHORIZE="auto"

# --- NVIDIA driver / power (re-applied on every boot) ---
NVIDIA_DRIVER_PKG="nvidia-driver-595-open"
NVIDIA_MOK_STRATEGY="canonical"
NVIDIA_POWER_LIMIT_W="400"

# --- Hardware target (illustrative — re-detected on the new machine) ---
HW_VENDOR="nvidia"
HW_MODEL="NVIDIA GeForce RTX 5080 (Blackwell, sm_120)"
HW_SM="120"
HW_VRAM_GB="16"
