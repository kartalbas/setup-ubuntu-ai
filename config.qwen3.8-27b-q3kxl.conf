# =============================================================================
# config.qwen3.8-27b-q3kxl.conf — Qwen3.8-27B as a 3-bit GGUF (Unsloth
# UD-Q3_K_XL) on a single 16 GB NVIDIA GPU (measured on an RTX 5070 Ti), text
# only, a 144k context. The comparison point for config.bonsai2-27b.conf: a
# stock quant of the same model, all of it on the card.
#
# The model: Unsloth's dynamic 3-bit quant of Qwen3.8-27B, 13,146,393,504
# bytes (12.24 GiB; unsloth/Qwen3.8-27B-GGUF file list). No 4-bit file fits
# beside even a 100k cache: UD-IQ4_XS has 13.27 GiB of weights, UD-Q4_K_S
# 14.30.
#
# The fit, from the model's config.json: 16 of its 64 layers keep a KV cache
# (the other 48 are linear attention with a fixed state of about 0.14 GiB),
# 2 x 4 heads x 256 = 32768 values per token. As q4_0 that is 18 KiB a token,
# 2.53 GiB at 147456 tokens. Measured on the card at 102400 tokens: the
# server holds 14488 MiB and 1344 MiB stay free. The 45056 tokens more take
# 792 MiB of that, and the rest, about 0.5 GiB, is left for the CUDA pool,
# which grows during a long prompt.
#
# The cache: this engine rotates K before it quantizes it; on Bonsai a q4_0
# cache measured perplexity 8.668 against 8.622 with f16.
#
# The engine: the same pinned PrismML llama.cpp fork as the Bonsai profile, so
# switching between the two profiles rebuilds nothing.
#
# Deploy on a machine (any username; keeps an installed API key):
#   sudo ./deploy.sh qwen3.8-27b-q3kxl
# =============================================================================

# --- Engine: pinned for reproducibility; bump deliberately (build, test, commit).
LLAMACPP_REPO="https://github.com/PrismML-Eng/llama.cpp"
LLAMACPP_REF="bdc23b56b4458b9f1655aec5287f3ab56ee8daaa"

# --- Model (downloaded from Hugging Face by `restore`) ---
MODEL_REPO="unsloth/Qwen3.8-27B-GGUF"
MODEL_FILE="Qwen3.8-27B-UD-Q3_K_XL.gguf"

# --- Runtime ---
# The stock template refuses a system message after the first one, which Claude
# Code sends (its environment); the regenerated one renders it as a system turn.
CHAT_TEMPLATE_FIXUP="1"
LLAMA_CTX="147456"
LLAMA_NGL="999"
LLAMA_HOST="0.0.0.0"
LLAMA_PORT="8080"
# Clients send it as "Authorization: Bearer <key>"; served from a root-only
# systemd credential. deploy.sh keeps an installed key or generates one.
LLAMA_API_KEY="REPLACE_WITH_YOUR_API_KEY"
#   --cache-type-k/v q4_0  4.5-bit KV cache, 2.53 GiB at 144k
#   --parallel 1           one slot: the hybrid model's recurrent state grows
#                          with every slot
#   --no-mmap              weights live in VRAM, not also in the page cache
#   samplers               Qwen3.8 thinking-mode recommendation, as for Bonsai
LLAMA_EXTRA_ARGS="--flash-attn on --parallel 1 --cache-type-k q4_0 --cache-type-v q4_0 --no-mmap --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0"

# --- eGPU transport (harmless on an internal GPU; auto-authorizes a TB dock) ---
TB_AUTHORIZE="auto"

# --- NVIDIA driver / power (re-applied on every boot) ---
NVIDIA_DRIVER_PKG="nvidia-driver-595-open"
NVIDIA_MOK_STRATEGY="canonical"
NVIDIA_POWER_LIMIT_W="400"

# --- Target hardware (re-detected by `restore`; lets --dry-run walk through) ---
HW_VENDOR="nvidia"
HW_SM="120"
