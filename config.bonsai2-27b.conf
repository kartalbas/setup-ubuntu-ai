# =============================================================================
# config.bonsai2-27b.conf — Ternary Bonsai 2 27B (PrismML) with vision on a
# single 16 GB NVIDIA GPU (RTX 5080 class): the full 262k context.
#
# The model: PrismML's ternary version of Qwen3.8-27B — weights in {-1, 0, +1}
# in a Hadamard-rotated basis, 7.2 GB instead of 54 GB. Vendor-measured: ~98 %
# of the FP16 20-benchmark average; long-horizon agent runs (SWE-bench
# Verified, Terminal-Bench) keep ~75 %.
#
# The engine: PrismML's own llama.cpp fork (branch `prism`, the runtime their
# Bonsai-demo uses), pinned. It carries the ternary kernels (PQ2_0 / PTQ1_0 +
# the runtime Hadamard transform) that upstream llama.cpp does not have yet.
#
# Measured on an RTX 5080 (16 GB), CUDA 13.4, engine bdc23b56b:
#   * perplexity (wikitext-2, 4×2048): 8.622 with f16 KV (PrismML reference
#     8.623); q5_0 KV 8.620, q8_0 8.624, q4_0 8.668
#   * VRAM: 14.96 GiB loaded, 15.09 of 15.84 GiB at a 241k-token prompt
#     plus an image
#   * ~88 tok/s generation at short context, ~22 tok/s at 240k;
#     ~950 tok/s prompt processing
#
# Deploy on a machine (any username; keeps an installed API key):
#   sudo ./deploy.sh bonsai2-27b
#   sudo ./deploy.sh bonsai2-27b --key MYKEY
# =============================================================================

# --- Engine: pinned for reproducibility; bump deliberately (build, test, commit).
LLAMACPP_REPO="https://github.com/PrismML-Eng/llama.cpp"
LLAMACPP_REF="bdc23b56b4458b9f1655aec5287f3ab56ee8daaa"

# --- Model (downloaded from Hugging Face by `restore`) ---
MODEL_REPO="prism-ml/Ternary-Bonsai-2-27B-gguf"
MODEL_FILE="Ternary-Bonsai-2-27B-PQ2_0.gguf"
# Vision: the image encoder. Drop this line for a text-only server.
MODEL_MMPROJ_FILE="Ternary-Bonsai-2-27B-mmproj-Q8_0.gguf"

# --- Runtime ---
# The stock template refuses a system message after the first one, which Claude
# Code sends (its environment); the regenerated one renders it as a system turn.
CHAT_TEMPLATE_FIXUP="1"
# The model's full native context. A 5.5-bit KV cache (21.5 KB/token) keeps
# 262k plus the vision encoder inside 16 GB with ~0.75 GiB to spare.
LLAMA_CTX="262144"
LLAMA_NGL="999"
LLAMA_HOST="0.0.0.0"
LLAMA_PORT="8080"
# Clients send it as "Authorization: Bearer <key>"; served from a root-only
# systemd credential. deploy.sh keeps an installed key or generates one.
LLAMA_API_KEY="REPLACE_WITH_YOUR_API_KEY"
#   --cache-type-k/v q5_0  5.5-bit KV cache; the engine Hadamard-rotates the
#                          quantized K cache — measured as good as f16 above
#   --parallel 1           one slot: the hybrid model's recurrent state grows
#                          with every slot
#   --no-mmap              weights live in VRAM, not also in the page cache
#   samplers               Qwen3.8 / PrismML thinking-mode recommendation
LLAMA_EXTRA_ARGS="--flash-attn on --parallel 1 --cache-type-k q5_0 --cache-type-v q5_0 --no-mmap --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0"

# --- eGPU transport (harmless on an internal GPU; auto-authorizes a TB dock) ---
TB_AUTHORIZE="auto"

# --- NVIDIA driver / power (re-applied on every boot) ---
NVIDIA_DRIVER_PKG="nvidia-driver-595-open"
NVIDIA_MOK_STRATEGY="canonical"
NVIDIA_POWER_LIMIT_W="400"

# --- Target hardware (re-detected by `restore`; lets --dry-run walk through) ---
HW_VENDOR="nvidia"
HW_SM="120"
