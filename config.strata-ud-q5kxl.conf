# =============================================================================
# config.strata-ud-q5kxl.conf — Qwen3.8-Flash-Next (a 125B MoE, 24,576 experts,
# 10 per token) on the Strata engine, as Unsloth's UD-Q5_K_XL, with the
# model's full 262,144-token context, on one 16 GB NVIDIA GPU and 128 GB of RAM
# (target: RTX 5080, Ryzen 9 9950X3D, 2 x 64 GB DDR5-6000).
#
# The engine: Strata (https://github.com/Niko1221/Strata) keeps the most used
# experts on the GPU, every expert in RAM and the 50.7 GiB lookup table (PLE)
# on the SSD, and drafts with the model's MTP layer. Its installer compiles the
# engine here (no ready-made Linux build) with the CUDA toolkit from 'drivers'.
#
# The model: Unsloth's 5-bit file at the revision Strata pins (6 shards,
# 158.3 GB, SHA-256 checked). Routed experts Q5_K (gate/up) and Q8_0 (down),
# 91.6 GiB, all of them in RAM. Strata's quality yardstick against Q8_0: the
# same top token 94.55 %, mean KL 0.038 (UD-Q4_K_XL 93.09 % / 0.056, NVFP4
# 92.09 % / 0.070; docs/QUANTS.md and docs/NVFP4.md in Strata).
#
# The memory, by Strata's numbers: experts 91.6 GiB + the KV cache at 262K
# (int8, streamed to RAM: ~13.7 KB a token, 3.4 GiB; 32K tokens of it stay in
# VRAM) + the system and engine (~8 GiB) = ~103 GiB of 121 GiB; what is left
# holds part of the lookup table in the page cache, the rest is read from the
# SSD while it answers. Not measured on this machine yet.
#
# Deploy on a machine (any username; keeps an installed API key):
#   sudo ./deploy.sh strata-ud-q5kxl
# =============================================================================

# --- Engine: Strata, pinned to a release; bump deliberately (build, test, commit).
ENGINE="strata"
STRATA_REPO="https://github.com/Niko1221/Strata"
STRATA_REF="v0.1.44.1"

# --- Model and runtime: options of Strata's installer ---
STRATA_FAMILY="unsloth"
STRATA_MODEL="UD-Q5_K_XL"
#   the model's full trained context; the KV cache streams to RAM from 64K
STRATA_CONTEXT="262144"
#   8-bit K/V, Strata's default and its most precise cache
STRATA_KV="int8"
#   images through the GPU encoder (~1.4 GiB of VRAM, i.e. fewer cached experts)
STRATA_VISION="gpu"

# --- Fixes on top of the pinned release (patches/strata/), until upstream has them ---
#   tensorless-shard  UD-Q5_K_XL's metadata-only first shard passes the size check
STRATA_PATCHES="tensorless-shard"

# --- Network: the intranet reaches it on this machine's address ---
LLAMA_HOST="0.0.0.0"
LLAMA_PORT="8080"
# Clients send it as "Authorization: Bearer <key>" (Anthropic clients: x-api-key);
# served from a root-only systemd credential. deploy.sh keeps an installed key or
# generates one.
LLAMA_API_KEY="REPLACE_WITH_YOUR_API_KEY"

# --- eGPU transport (harmless on an internal GPU; auto-authorizes a TB dock) ---
TB_AUTHORIZE="auto"

# --- NVIDIA driver: the newest open driver with a Canonical-signed module, and
# the newest CUDA toolkit (Strata needs driver 580+ / CUDA 13) ---
NVIDIA_DRIVER_PKG="latest"
NVIDIA_MOK_STRATEGY="canonical"

# --- Target hardware (re-detected by `restore`; lets --dry-run walk through) ---
HW_VENDOR="nvidia"
HW_SM="120"
