# =============================================================================
# config.qwen3.8-27b-turbo.conf — "the real recipe", current generation:
# Qwen3.8-27B at 100k context on a single 16 GB GPU (RTX 5080 / A5000), via the
# spiritbuun/buun-llama-cpp engine using its VBR (variable-bit-rate) KV cache.
#
# What changed vs the older Qwen3.6 + turbo3_tcq recipe (forward, not backward):
#   * The KV cache is now VBR (`--cache-type-k/v vbr`), not a hand-picked fixed
#     tier. VBR runs the whole TurboQuant ladder (f16 → turbo8 → turbo4 →
#     turbo3_tcq → turbo2_tcq → turbo1_tcq) and degrades tensors DOWN the ladder
#     at runtime only under VRAM pressure, using a per-model price order measured
#     for the Qwen35 family (which Qwen3.8-27B belongs to). Result: f16 quality
#     at short contexts, full-depth capacity at 100k — from one flag, and you
#     never track KV formats again (new codecs roll into VBR automatically).
#   * Model is the jpetrina IQ4_XS *pure* GGUF — the 3.8 successor of the
#     Ununnilium 3.6 quant, same "pure IQ4_XS" body.
#
# To use it on a fresh machine (same 16 GB NVIDIA GPU, any username):
#   1. sudo cp config.qwen3.8-27b-turbo.conf /etc/setup-ubuntu-ai/config.conf
#   2. Set your own API key below (or drop "--api-key …" to serve without auth).
#   3. sudo ./setup.sh restore
#
# `restore` re-detects the GPU, re-homes the paths to the new user, builds the
# engine, downloads MODEL_REPO/MODEL_FILE from Hugging Face, and installs the
# auto-starting service — nothing is prepared by hand.
#
# REQUIREMENTS / GOTCHAS (enforced or warned about by the script):
#   * CUDA 13.1 or 13.3 ONLY. CUDA 13.0/13.2 make the TurboQuant/VBR KV codecs
#     output gibberish; the build step (40-build-llamacpp) aborts on those.
#   * VBR needs flash attention (force-enabled) and a CUDA backend; it disables
#     prompt-cache/slot state save and context-shift in dynamic mode (fine for a
#     stateless inference server). Keep --parallel 1 so KV stays single-stream.
#   * 16 GB GPU, model fully on GPU. ~13.5 GB weights + a ~1.2 GB VBR KV budget
#     fit 100k with headroom. Lower LLAMA_CTX if it OOMs on first load.
#   * One model at a time: this becomes THE served model on port 8080.
# =============================================================================

# --- llama.cpp engine: the buun-llama-cpp VBR/TurboQuant fork, in its OWN dir
#     so an existing upstream build is left untouched. ---
LLAMACPP_REPO="https://github.com/spiritbuun/buun-llama-cpp"
# Optional: pin a branch/tag/commit for reproducibility (empty = default branch,
# i.e. always the newest VBR engine on rebuild).
# LLAMACPP_REF=""
LLAMACPP_DIR="/home/server/buun-llama-cpp"
LLAMACPP_BACKEND="cuda"

# --- Chat template / runtime behaviour ---
# The pure GGUF already ships an agentic-friendly chat template; use as-is.
CHAT_TEMPLATE_FIXUP="0"
LLAMA_CTX="100000"
LLAMA_NGL="999"
LLAMA_HOST="0.0.0.0"
LLAMA_PORT="8080"
# The current recipe: VBR KV on BOTH sides (dynamic, full ladder to t1) and
# --parallel 1 (single-stream KV, required by dynamic VBR). --no-mmap pins the
# weights in VRAM. NOTE: no "--fit off" here — VBR derives its KV budget FROM the
# fit pass, so fitting must stay on. Samplers are Qwen's recommended values.
# Replace the API key or drop "--api-key …" (only safe on a trusted LAN — 0.0.0.0).
LLAMA_EXTRA_ARGS="--flash-attn on --parallel 1 --cache-type-k vbr --cache-type-v vbr --no-mmap --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0.0 --api-key REPLACE_WITH_YOUR_API_KEY"

# --- Model coordinates (downloaded straight from Hugging Face by `restore`) ---
MODEL_REPO="jpetrina/Qwen3.8-27B-IQ4_XS-pure-GGUF"
MODEL_FILE="qwen3.8-27b-IQ4_XS-pure.gguf"

# --- eGPU transport (harmless on an internal GPU; auto-authorizes a TB dock) ---
TB_AUTHORIZE="auto"

# --- NVIDIA driver / power (re-applied on every boot) ---
NVIDIA_DRIVER_PKG="nvidia-driver-595-open"
NVIDIA_MOK_STRATEGY="canonical"
NVIDIA_POWER_LIMIT_W="400"

# --- Hardware target (illustrative — re-detected on the new machine) ---
HW_VENDOR="nvidia"
HW_MODEL="NVIDIA GeForce RTX 5080 (Blackwell, sm_120)"
HW_SM="120"
HW_VRAM_GB="16"
