# =============================================================================
# config.example.conf — a known-good profile you can copy and reuse.
#
# This is the verified setup for: RTX 5080 (16 GB, Blackwell sm_120) in an
# external eGPU dock, serving Devstral-Small-2-24B (IQ4_XS) at 64k context for
# agentic coding (OpenCode etc.). It is OPTIONAL — a template, not required.
#
# To use it on a fresh machine (same external GPU, any username):
#   1. sudo cp config.example.conf /etc/setup-ubuntu-ai/config.conf
#   2. Set your own API key below (or remove the --api-key … part to disable auth).
#   3. sudo ./setup.sh restore
#
# `restore` re-detects the hardware, re-homes the paths to the new user, and
# downloads the exact model from MODEL_REPO/MODEL_FILE — nothing is prepared by
# hand. The chat template is regenerated from the GGUF (CHAT_TEMPLATE_FIXUP=1),
# which neutralises the "roles must alternate" guard that breaks agentic clients.
#
# NOTE: the HW_* values and any absolute paths below are illustrative — they are
# overwritten by `detect`/`build`/`model` on the target machine. The keys that
# actually drive a restore are MODEL_REPO, MODEL_FILE, the LLAMA_* runtime knobs,
# CHAT_TEMPLATE_FIXUP, and the NVIDIA_* driver/power settings.
# =============================================================================

# --- Chat template / runtime behaviour ---
CHAT_TEMPLATE_FIXUP="1"
LLAMA_CTX="65536"
LLAMA_NGL="999"
LLAMA_HOST="0.0.0.0"
LLAMA_PORT="8080"
# Flash-attention + q4_0 KV cache keep a 24B model + 64k context inside 16 GB.
# Replace REPLACE_WITH_YOUR_API_KEY with your own secret, or drop "--api-key …"
# entirely to serve without authentication (only safe on a trusted LAN).
LLAMA_EXTRA_ARGS="--flash-attn on --cache-type-k q4_0 --cache-type-v q4_0 --api-key REPLACE_WITH_YOUR_API_KEY"

# --- Model coordinates (downloaded straight from Hugging Face by `restore`) ---
MODEL_REPO="bartowski/mistralai_Devstral-Small-2-24B-Instruct-2512-GGUF"
MODEL_FILE="mistralai_Devstral-Small-2-24B-Instruct-2512-IQ4_XS.gguf"

# --- eGPU transport ---
# The external GPU is brought onto the bus automatically regardless of how it is
# attached: OcuLink / a slot riser is a direct PCIe link (always on the bus),
# while Thunderbolt 4 / USB4 tunnels PCIe and must be authorized first. Leave
# TB_AUTHORIZE at "auto" to enroll a TB eGPU dock automatically (it then auto-
# authorizes on every future boot). Set it to "no" to opt out of auto-auth.
TB_AUTHORIZE="auto"

# --- NVIDIA driver / power (re-applied on every boot) ---
NVIDIA_DRIVER_PKG="nvidia-driver-595-open"
NVIDIA_MOK_STRATEGY="canonical"
NVIDIA_POWER_LIMIT_W="400"

# --- Hardware target (illustrative — re-detected on the new machine) ---
HW_VENDOR="nvidia"
HW_MODEL="NVIDIA GeForce RTX 5080 (Blackwell, sm_120)"
HW_SM="120"
HW_VRAM_GB="16"
LLAMACPP_BACKEND="cuda"
